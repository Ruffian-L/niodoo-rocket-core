[package]
name = "niodoo-mvp"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
qdrant-client = { version = "1.11", optional = true }
uuid = { version = "1.0", optional = true }

[features]
default = []
qdrant = ["dep:qdrant-client", "dep:uuid"]

[[bin]]
name = "mvp"
path = "src/main.rs"
